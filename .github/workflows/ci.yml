# Required checks for main (spec 008). Branch protection names both jobs: verify, human-gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  human-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The human approved the branch as it stands, so fingerprint the PR head, not the merge ref
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      # gate.mjs uses only Node built-ins and git, so no npm ci
      - run: npm run gate:check
