# Required checks for main (spec 008). Branch protection names both jobs: verify, human-gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so `touched` finds the merge base with main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Path filters (spec 013): test only the scopes a PR touched; pushes to main test everything.
      # This job always reports, so the required `verify` check never stays pending.
      - name: Areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            touched=$'deck\npackage'
          else
            touched=$(node packages/understand-gate/bin/understand-gate.mjs touched --base "$BASE_SHA")
          fi
          for scope in deck package; do
            if grep -qx "$scope" <<<"$touched"; then echo "$scope=true"; else echo "$scope=false"; fi >> "$GITHUB_OUTPUT"
          done
          echo "Touched scopes: ${touched:-none}"
      - if: steps.areas.outputs.deck == 'true'
        run: npm ci
      - if: steps.areas.outputs.deck == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.areas.outputs.deck == 'true'
        run: npm run verify:deck
      - if: steps.areas.outputs.package == 'true'
        run: npm test -w understand-gate

  human-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The human approved the branch as it stands, so fingerprint the PR head, not the merge ref
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # gate.mjs uses only Node built-ins and git, so no npm ci
      - run: npm run gate:check
