# AI code review on every pull request (spec 008). Advisory: not a required check, so an outage
# or a missing token never blocks the human's decision at the review gate.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks cannot read repository secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping AI review"; fi

      - if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - if: steps.secret.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the AI code reviewer in an AI-driven SDLC. A human reads your review aloud at the
            review gate and decides yes or no, so write plain, short findings a listener can follow.

            Review the diff of this pull request against main (`gh pr diff`). Check:
            1. The constitution in .specify/memory/constitution.md: code traces to a BMad Story and a
               spec under specs/; human `content:` commits touch only slide wording and notes in pages/*.md;
               slides stay offline-safe; Slidev built-ins preferred over custom code.
            2. Correctness and edge cases, and whether tests cover the change.
            3. Secrets, tokens, or personal email addresses in code, config, or commit messages.
            4. Workflow safety: pinned action versions, least permissions, secrets only via `secrets.*`.

            Tag each finding 🔴 critical, 🟡 medium, or 🔵 minor, with file:line and a one-line fix.
            If there is nothing to report, say "No findings."

            Post exactly one top-level PR comment whose first line is exactly `## AI code review`.
            If an earlier comment from you starting with that line exists, update it with
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file <file>`;
            otherwise create one with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*)"
