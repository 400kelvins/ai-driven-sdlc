# Required check `understand-gate` (spec 013, architecture AD-2): a pull request cannot weaken its own gate.
# pull_request_target runs this file, the checker, and the scope config from main. The PR head is checked
# out only as data: git reads it, nothing from it is installed or run.
name: understand-gate

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: understand-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  understand-gate:
    # No job-level `if`: GitHub counts a skipped required check as passing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Same-repository pull requests only
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests from forks are not checked; a maintainer must bring the change into this repository."
            exit 1
          fi
      - name: Checker and config from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Pull request head, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The reviewer's yes lines (spec 014); one {login, type, body} per line, read by the checker
      - name: Pull request comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | {login: .user.login, type: .user.type, body: .body} | tojson' > comments.ndjson
      # Main's checker, run against the PR head
      - name: Check every touched scope
        working-directory: head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node ../base/packages/understand-gate/bin/understand-gate.mjs check --base "$BASE_SHA" --comments ../comments.ndjson
